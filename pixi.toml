[workspace]
authors = ["jein <darshgupta71@gmail.com>"]
channels = ["conda-forge"]
name = "solar"
platforms = ["win-64"]
version = "0.1.0"

[tasks]

[dependencies]
# Conda packages (these work fine on Windows)
python = "*"
pyyaml = "*"
pillow = "*"
opencv = "*"
pandas = "*"
pytorch = "*"
scikit-image = "*"
pycocotools = "*"
maturin ="*"
tqdm = "*"

[target.win-64.pypi-dependencies]
# PyPI packages (JAX ecosystem must come from pip on Windows)
jax = { version = "*", extras = ["cpu"] }
equinox = "*"
optax = "*"
