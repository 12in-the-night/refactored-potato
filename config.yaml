# ==========================================
# Solar Filament Segmentation Configuration
# ==========================================

paths:
  # When running on Kaggle, this path will be used automatically
  kaggle_base: "/kaggle/input/competitions/filament-segmentation-2026/MAGFiLO_1.0_Kaggle_2026"

  # When running locally on your PC, this path will be used
  local_base: "./data/MAGFiLO_1.0_Kaggle_2026"

  train_img: "train/train_images"
  ann_file: "train/MAGFiLO_1.0_Annotations_kaggle2026_train.json"
  test_img: "test/test_images"

hyperparameters:
  img_size: 512        # The chunk size
  per_device_batch: 2  # 2 * 8 TPU cores = 16 total batch size
  epochs: 15
  learning_rate: 0.001
  seed: 42
